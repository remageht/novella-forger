name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Build server + web
        run: npm run build

      - name: Smoke test (demo API)
        run: |
          node server/dist/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/health
          curl -sf -o /dev/null http://localhost:3001/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/nope)" = "404"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
